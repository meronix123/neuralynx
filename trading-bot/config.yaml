# ------------------------------------------------------------
#  Bitget Trading-Bot - Einstellungen
# ------------------------------------------------------------

# paper = Simulation mit echten Kursen, kein echtes Geld (START HIER)
# demo  = Bitget-Demokonto (Demo-API-Schluessel noetig)
# live  = ECHTES GELD
mode: paper

# Handelspaare. GOLD und SILVER sucht der Bot automatisch auf Bitget
# (XAU/XAUT/PAXG bzw. XAG). Nicht verfuegbare Paare werden uebersprungen.
symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - SOL/USDT:USDT
  - XRP/USDT:USDT
  - GOLD
  - SILVER

# Startwerte aus dem ersten Strategie-Test (4h, Limit-Einstieg, Teilverkauf bei +1R).
# Nach "python run.py optimize" ggf. anpassen. Noch KEIN Beweis -> erst Paper-Modus!
timeframe: 4h          # Einstiegs-Zeiteinheit
trend_timeframe: 1d    # Trendfilter
leverage: 10
margin_mode: isolated  # isolated = maximaler Verlust pro Position begrenzt

risk:
  risk_per_trade_pct: 1.0        # max. Verlust pro Trade in % vom Konto (bei Stop-Loss, inkl. Gebuehren)
  max_margin_per_trade_pct: 30   # max. Anteil vom Konto als Margin pro Position
  max_open_positions: 3
  max_same_direction: 2          # max. Positionen gleicher Richtung (Krypto laeuft oft gleich)
  max_trades_per_day: 30
  daily_loss_limit_pct: 6.0      # Tagesverlust erreicht -> keine neuen Trades bis morgen (UTC)
  max_total_drawdown_pct: 30.0   # Konto 30 % unter Hoechststand -> Bot eroeffnet nichts mehr
  max_consecutive_losses: 4      # nach 4 Verlusten in Folge ...
  pause_after_losses_minutes: 60 # ... 1 Stunde Pause

strategy:
  ema_fast: 21
  ema_slow: 50
  trend_ema_fast: 20
  trend_ema_slow: 50
  rsi_period: 14
  rsi_long_trigger: 40     # Ausloeser Long: RSI kreuzt nach Ruecksetzer ueber 40
  rsi_short_trigger: 60    # Ausloeser Short: RSI kreuzt nach Anstieg unter 60
  rsi_overbought: 70
  rsi_oversold: 30
  adx_min: 20              # Trendstaerke
  min_score: 5             # Punkte (von 6) fuer einen Einstieg. 3 = mehr Trades, 5 = weniger
  atr_period: 14
  # Welche Strategien darf der Bot je nach Marktlage einsetzen?
  #   trend    = Trend-Ruecksetzer (bei klarem Trend)
  #   range    = Rueckkehr zur Mitte (seitwaerts)
  #   breakout = Ausbruch nach Ruhephase
  strategies: [trend, range, breakout]
  adx_trend: 22            # ADX ab hier = Trend
  adx_range: 18            # ADX unter hier = seitwaerts
  squeeze_pct: 0.2         # Bollinger-Breite in den untersten 20 % = Ruhephase
  squeeze_lookback: 6      # Ruhephase muss in den letzten 6 Bars gewesen sein
  donchian: 20             # Ausbruch ueber das Hoch/Tief der letzten 20 Bars
  bo_volume_factor: 1.5    # Ausbruch braucht 1,5-faches Volumen
  bo_sl_atr: 1.5           # Ausbruch: Stop 1,5 x ATR
  bo_tp_atr: 3.0           # Ausbruch: Ziel 3 x ATR
  mr_sl_atr: 1.0           # Seitwaerts: Stop 1 x ATR, Ziel = mittleres Bollinger-Band
  mr_min_rr: 1.0           # Seitwaerts: Ziel muss mind. so weit weg sein wie der Stop
  chaos_atr_rank: 0.97     # Volatilitaet in den obersten 3 % = Chaos -> nicht handeln
  leader_filter: true      # BTC im Abwaertstrend -> keine Altcoin-Longs (und umgekehrt)
  health_window: 10        # letzte 10 Trades je Strategie beobachten ...
  health_min_pf: 0.6       # ... Profit-Faktor darunter -> Strategie pausiert
  health_pause_signals: 10 # nach 10 ausgelassenen Signalen ein Probe-Trade (sonst bliebe sie ewig aus)
  max_hold_bars: 12        # nach 12 Bars ohne +0,5R und ohne Teilverkauf schliessen (0 = aus)
  ml_filter: false         # selbstlernender Filter; erst einschalten, wenn "python run.py backtest"
                           # Lernbeispiele gespeichert hat (data/ml_examples.json)
  ml_threshold: 0.45       # Signale mit geschaetzter Gewinnchance darunter werden verworfen
  ml_min_trades: 40        # so viele Lernbeispiele braucht das Modell mindestens
  sl_atr: 1.0              # Stop-Loss = 1 x ATR
  tp_atr: 2.0              # Take-Profit = 2 x ATR
  partial_tp_r: 1.0        # bei +1R die Haelfte verkaufen und Stop auf Einstand (0 = aus)
  partial_tp_frac: 0.5
  breakeven_at_r: 1000000000  # Trailing-Stop aus (sehr grosser Wert). 1.0 = ab +1R nachziehen
  trail_atr: 1.0           # Abstand des Trailing-Stops, falls aktiv
  min_atr_pct: 0.08        # zu ruhiger Markt -> Gebuehren fressen den Gewinn -> kein Trade
  max_atr_pct: 1.5         # zu wilder Markt -> kein Trade
  volume_factor: 1.0       # Volumen muss >= Durchschnitt sein
  max_funding_rate: 0.0005 # extreme Funding-Rate -> nicht mit der Masse handeln

flow:
  book_depth_pct: 0.5      # Orderbuch im Bereich +-0,5 % um den Kurs auswerten
  flow_block: 0.35         # Orderbuch + Taker-Fluss klar dagegen (<= -0,35) -> kein Trade
  display_refresh_s: 120   # wie oft die Oberflaeche Orderbuch-Daten neu holt

filters:
  max_spread_pct: 0.05     # Geld/Brief-Spanne zu gross -> kein Trade
  metals_trade_weekend: false  # Gold/Silber am Wochenende nicht handeln (duenner Markt)

context:
  currencies: [USD]        # Termine dieser Waehrungen beachten (z. B. [USD, EUR, CNY])
  impacts: [High]          # nur Termine mit hoher Wirkung
  minutes_before: 30       # so lange vor dem Termin keine neuen Trades
  minutes_after: 30        # und so lange danach
  block_if_calendar_unavailable: false
  fng_extreme_low: 15      # Fear & Greed unter 15 oder ...
  fng_extreme_high: 85     # ... ueber 85 -> Risiko pro Trade halbieren

fees:
  entry_order: limit   # market = sofort (Taker) | limit = Limit-Order zum Signalkurs (Maker, guenstiger)
  maker: 0.0002    # Bitget Futures Maker-Gebuehr (Limit-Orders)
  taker: 0.0006    # Bitget Futures Taker-Gebuehr
  slippage: 0.0003 # geschaetzter Kursverlust bei Market-Orders

paper:
  start_equity: 35  # Startkapital in USDT fuer die Simulation

dashboard:
  enabled: true
  port: 8050        # im Browser: http://localhost:8050

loop_seconds: 20
